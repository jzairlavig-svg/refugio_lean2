<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fc" />
  <title>Refugio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #f6f7fc;
  --card: #ffffff;
  --ink: #22264a;
  --muted: #7b809e;
  --line: #e4e7f5;
  --primary: #6b6ff2;
  --primary-dark: #5a5ee0;
  --primary-soft: #eceeff;
  --green: #e4f4ea;
  --green-dot: #3fbf6a;
  --yellow: #fff3d1;
  --yellow-dot: #f4c430;
  --red: #fde8ea;
  --red-dot: #ec4b5a;
  --peach: #fdeee4;
  --radius: 18px;
  --shadow: 0 2px 10px rgba(60, 64, 120, 0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body {
  width: 100%;
  height: 100%;
  background: var(--bg);
  color: var(--ink);
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---------- Contenedor Principal Adaptable (Estilo Duolingo) ---------- */
.phone {
  position: relative;
  width: 100%;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
}

/* Área central de contenido */
.screen {
  flex: 1;
  width: 100%;
  max-width: 680px;
  margin: 0 auto;
  padding: 20px 20px 96px;
}
.screen > * { animation: fade 0.25s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* Panel derecho estilo Duolingo (visible en PC de escritorio) */
.right-rail {
  display: none;
}

/* ---------- Barra de Navegación (Inferior en Móvil / Lateral en PC) ---------- */
.tabbar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 15;
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 8px 10px calc(8px + env(safe-area-inset-bottom, 0px));
  background: #ffffff;
  border-top: 2px solid var(--line);
}

.sidebar-brand {
  display: none;
}

.tab {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  font-size: 11px;
  font-weight: 500;
  color: #7d819d;
  padding: 4px 8px;
  border-radius: 14px;
  transition: all 0.2s;
}
.tab .pill {
  padding: 5px 16px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  transition: background 0.2s;
}
.tab.active {
  color: var(--primary);
  font-weight: 700;
}
.tab.active .pill {
  background: var(--primary-soft);
}

/* ---------- Diseño Tablet y Computadora (Modo Duolingo Web) ---------- */
@media (min-width: 768px) {
  .phone.logged-in {
    padding-left: 250px;
  }

  .tabbar {
    top: 0;
    bottom: 0;
    left: 0;
    right: auto;
    width: 250px;
    flex-direction: column;
    justify-content: flex-start;
    align-items: stretch;
    padding: 28px 16px;
    border-top: 0;
    border-right: 2px solid var(--line);
    gap: 8px;
  }

  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 24px;
    font-weight: 700;
    color: var(--primary);
    padding: 4px 14px 24px;
    letter-spacing: -0.5px;
    user-select: none;
    cursor: pointer;
  }

  .tab {
    flex-direction: row;
    gap: 14px;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 16px;
    border: 2px solid transparent;
    border-radius: 16px;
  }
  .tab:hover {
    background: #f3f4fb;
  }
  .tab .pill {
    padding: 0;
    background: transparent !important;
  }
  .tab.active {
    background: var(--primary-soft);
    color: var(--primary);
    border-color: #d0d3ff;
  }

  .screen {
    padding: 36px 32px 60px;
  }

  /* Tarjetas más amplias en escritorio */
  .card {
    padding: 22px;
    border: 2px solid var(--line);
    box-shadow: none;
  }
  .post {
    padding: 20px;
    border: 2px solid var(--line);
    box-shadow: none;
  }
  .row-card, .mini {
    border: 2px solid var(--line);
    box-shadow: none;
  }
}

/* Computadoras de pantalla ancha: agrega el panel derecho tipo Duolingo */
@media (min-width: 1160px) {
  .phone.logged-in {
    display: grid;
    grid-template-columns: 1fr 340px;
    max-width: 1360px;
    margin: 0 auto;
    gap: 28px;
    padding-right: 32px;
  }

  .phone.logged-in .screen {
    max-width: 720px;
    margin: 0 auto;
  }

  .phone.logged-in .right-rail {
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding-top: 36px;
    position: sticky;
    top: 0;
    height: fit-content;
  }
}

/* ---------- Vista de Login / Registro en pantalla completa ---------- */
.phone.auth-view {
  padding-left: 0 !important;
  display: flex !important;
  justify-content: center;
  align-items: center;
}
.phone.auth-view .screen {
  max-width: 460px;
  padding: 24px 20px;
  flex: initial;
}

/* ---------- Encabezados ---------- */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
}
.header h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; }
.header .hello { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; color: var(--muted); }
.brand {
  display: flex; align-items: center; gap: 5px;
  color: var(--primary); font-size: 13px; font-weight: 700;
  user-select: none;
}
.subtle { color: var(--muted); font-size: 13.5px; }
.center { text-align: center; }

/* ---------- Avatares ---------- */
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 22px; flex-shrink: 0;
  background: #f6e3d6;
  box-shadow: inset 0 0 0 2px #fff, 0 0 0 1.5px var(--line);
}
.avatar.sm { width: 34px; height: 34px; font-size: 17px; }
.avatar.lg { width: 66px; height: 66px; font-size: 36px; }

/* ---------- Tarjetas ---------- */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 18px;
  margin-bottom: 16px;
}
.card h2 { font-size: 19px; font-weight: 600; margin-bottom: 4px; }
.card h3 { font-size: 15px; font-weight: 600; }
.card p.desc { font-size: 13.5px; color: var(--muted); line-height: 1.45; }

.section-title { font-size: 16px; font-weight: 700; margin: 22px 2px 12px; }

/* ---------- Estado de ánimo ---------- */
.moods { display: flex; justify-content: space-between; gap: 8px; margin-top: 16px; }
.mood {
  flex: 1;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  font-size: 11px; color: var(--muted);
  padding: 6px 2px; border-radius: 14px;
}
.mood span.face {
  width: 52px; height: 52px; border-radius: 16px;
  background: #f6f7fb;
  display: grid; place-items: center; font-size: 27px;
  border: 2px solid transparent;
  transition: all 0.2s;
}
.mood:hover span.face { transform: translateY(-2px); }
.mood.active span.face { border-color: var(--primary); background: var(--primary-soft); transform: scale(1.06); }
.mood.active { color: var(--primary); font-weight: 700; }

.banner {
  display: flex; align-items: center; gap: 10px;
  background: #eceeff; color: #4a4eb8;
  border-radius: 16px; padding: 14px 16px;
  font-size: 13.5px; font-weight: 500; margin-bottom: 8px;
}

/* ---------- Pausa ---------- */
.pause {
  position: relative; overflow: hidden;
  background: linear-gradient(120deg, var(--peach), #fbe3d3);
  border-radius: 20px; padding: 22px;
  min-height: 155px;
  display: flex; flex-direction: column; justify-content: center;
}
.pause small { font-size: 11px; letter-spacing: 0.6px; color: #9a7a68; font-weight: 700; }
.pause h3 { font-size: 23px; font-weight: 700; line-height: 1.15; margin: 6px 0 14px; max-width: 220px; }
