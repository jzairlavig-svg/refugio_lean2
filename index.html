<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f7fc" />
  <title>Refugio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root {
  --bg: #f6f7fc;
  --card: #ffffff;
  --ink: #22264a;
  --muted: #7b809e;
  --line: #eceef7;
  --primary: #6b6ff2;
  --primary-dark: #5a5ee0;
  --primary-soft: #eceeff;
  --green: #e4f4ea;
  --green-dot: #3fbf6a;
  --yellow: #fff3d1;
  --yellow-dot: #f4c430;
  --red: #fde8ea;
  --red-dot: #ec4b5a;
  --peach: #fdeee4;
  --radius: 18px;
  --shadow: 0 2px 10px rgba(60, 64, 120, 0.06);
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

html, body { height: 100%; }

body {
  font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: #e9ebf5;
  color: var(--ink);
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
}

button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }

/* ---------- Marco del teléfono ---------- */
.phone {
  position: relative;
  width: 100%;
  max-width: 400px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

@media (min-width: 520px) {
  .phone {
    height: min(860px, 94vh);
    border-radius: 40px;
    box-shadow: 0 30px 80px rgba(50, 55, 110, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.6);
  }
}

.statusbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 26px 6px;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}
.status-icons { display: flex; gap: 6px; align-items: center; }

.screen {
  flex: 1;
  overflow-y: auto;
  padding: 14px 20px 24px;
  scrollbar-width: none;
}
.screen::-webkit-scrollbar { display: none; }
.screen > * { animation: fade 0.3s ease both; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- Encabezados ---------- */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.header h1 { font-size: 24px; font-weight: 500; letter-spacing: -0.3px; }
.header .hello { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }
.brand {
  display: flex; align-items: center; gap: 5px;
  color: var(--primary); font-size: 12px; font-weight: 600;
}
.subtle { color: var(--muted); font-size: 13px; }
.center { text-align: center; }

/* ---------- Avatares ---------- */
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  display: grid; place-items: center;
  font-size: 22px; flex-shrink: 0;
  background: #f6e3d6;
  box-shadow: inset 0 0 0 2px #fff, 0 0 0 1px var(--line);
}
.avatar.sm { width: 30px; height: 30px; font-size: 16px; }
.avatar.lg { width: 62px; height: 62px; font-size: 34px; }

/* ---------- Tarjetas ---------- */
.card {
  background: var(--card);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 16px;
  margin-bottom: 14px;
}
.card h2 { font-size: 19px; font-weight: 500; margin-bottom: 4px; }
.card h3 { font-size: 15px; font-weight: 600; }
.card p.desc { font-size: 13px; color: var(--muted); line-height: 1.45; }

.section-title { font-size: 15px; font-weight: 600; margin: 18px 2px 10px; }

/* ---------- Estado de ánimo ---------- */
.moods { display: flex; justify-content: space-between; margin-top: 14px; }
.mood { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 10px; color: var(--muted); }
.mood span.face {
  width: 46px; height: 46px; border-radius: 14px;
  background: #f6f7fb;
  display: grid; place-items: center; font-size: 25px;
  border: 1.5px solid transparent;
  transition: all 0.2s;
}
.mood.active span.face { border-color: var(--primary); background: var(--primary-soft); transform: scale(1.06); }
.mood.active { color: var(--primary); font-weight: 600; }

.banner {
  display: flex; align-items: center; gap: 10px;
  background: #eceeff; color: #4a4eb8;
  border-radius: 14px; padding: 12px 14px;
  font-size: 13px; margin-bottom: 6px;
}

/* ---------- Pausa ---------- */
.pause {
  position: relative; overflow: hidden;
  background: linear-gradient(120deg, var(--peach), #fbe3d3);
  border-radius: 20px; padding: 18px;
  min-height: 150px;
  display: flex; flex-direction: column; justify-content: center;
}
.pause small { font-size: 10px; letter-spacing: 0.6px; color: #9a7a68; font-weight: 600; }
.pause h3 { font-size: 22px; font-weight: 600; line-height: 1.15; margin: 6px 0 12px; max-width: 150px; }
.pause .link { color: var(--primary); font-size: 13px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.pause .art {
  position: absolute; right: -6px; bottom: -10px; font-size: 96px;
  filter: drop-shadow(0 8px 10px rgba(150, 100, 70, 0.25));
}

.row-card {
  display: flex; align-items: center; gap: 12px; width: 100%;
  background: var(--card); border-radius: 16px; padding: 14px;
  box-shadow: var(--shadow); text-align: left; margin-bottom: 10px;
}
.row-card .ico {
  width: 38px; height: 38px; border-radius: 12px;
  background: var(--primary-soft); color: var(--primary);
  display: grid; place-items: center; flex-shrink: 0;
}
.row-card .txt { flex: 1; }
.row-card .txt b { display: block; font-size: 14px; font-weight: 600; }
.row-card .txt span { font-size: 12px; color: var(--muted); }
.row-card .chev { color: #a5a9c4; }

/* ---------- Semáforo ---------- */
.semaforo { display: flex; flex-direction: column; gap: 10px; margin: 14px 0; }
.opt {
  display: flex; align-items: center; justify-content: space-between;
  padding: 15px 14px; border-radius: 14px; font-size: 13px; text-align: left;
  border: 1.5px solid transparent; transition: all 0.2s;
}
.opt.green { background: var(--green); }
.opt.yellow { background: var(--yellow); }
.opt.red { background: var(--red); }
.opt.active { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(107, 111, 242, 0.12); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 5px; vertical-align: middle; }
.dot.green { background: var(--green-dot); }
.dot.yellow { background: var(--yellow-dot); }
.dot.red { background: var(--red-dot); }
.check {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--primary); color: #fff;
  display: grid; place-items: center;
}

.btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
  background: var(--primary); color: #fff;
  padding: 14px; border-radius: 14px;
  font-size: 14px; font-weight: 600;
  box-shadow: 0 6px 16px rgba(107, 111, 242, 0.35);
  transition: transform 0.15s, background 0.2s;
}
.btn:hover { background: var(--primary-dark); }
.btn:active { transform: scale(0.98); }
.btn.ghost { background: var(--primary-soft); color: var(--primary); box-shadow: none; }

.note { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); margin-top: 10px; }

.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
.mini {
  background: var(--card); border-radius: 16px; padding: 14px;
  box-shadow: var(--shadow); text-align: left;
  display: flex; flex-direction: column; gap: 8px;
}
.mini .ico { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; }
.mini .ico.a { background: #fdeee9; color: #e0705a; }
.mini .ico.b { background: var(--primary-soft); color: var(--primary); }
.mini b { font-size: 14px; font-weight: 600; }
.mini span { font-size: 11.5px; color: var(--muted); line-height: 1.35; }

/* ---------- Comunidad ---------- */
.post { background: var(--card); border-radius: 18px; padding: 14px; box-shadow: var(--shadow); margin-bottom: 12px; }
.post-head { display: flex; align-items: center; gap: 10px; }
.post-head .who { flex: 1; font-size: 12.5px; }
.post-head .who b { font-weight: 600; }
.post-head .who small { display: block; font-size: 10.5px; color: var(--muted); }
.post p { font-size: 13.5px; line-height: 1.5; margin: 12px 0; }
.post-foot { display: flex; gap: 20px; border-top: 1px solid var(--line); padding-top: 10px; font-size: 12px; color: var(--muted); }
.post-foot button { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.post-foot button.liked { color: var(--primary); font-weight: 600; }
.post-foot button.liked svg { fill: var(--primary); }
.share { display: flex; justify-content: center; margin-top: 4px; }
.share button { color: var(--primary); font-size: 13px; font-weight: 500; display: inline-flex; gap: 6px; align-items: center; padding: 8px; }

/* ---------- Apoyo ---------- */
.hero { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
.hero h2 { font-size: 22px; font-weight: 600; }
.urgent { background: #e8ecf8; border-radius: 14px; padding: 13px 14px; font-size: 12px; line-height: 1.5; color: #4d5278; margin-top: 16px; }
.urgent b { display: block; color: var(--ink); font-size: 13px; margin-bottom: 3px; }
.top-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.top-row .ico { width: 36px; height: 36px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; }
.top-row b { display: block; font-size: 15px; }
.top-row span { font-size: 12px; color: var(--muted); }

/* ---------- Tab bar ---------- */
.tabbar {
  display: flex; justify-content: space-around;
  padding: 8px 10px 4px;
  background: #fff;
  border-top: 1px solid var(--line);
  flex-shrink: 0;
}
.tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10px; color: #7d819d; padding: 2px 6px; }
.tab .pill { padding: 6px 18px; border-radius: 14px; display: grid; place-items: center; transition: background 0.2s; }
.tab.active { color: var(--primary); font-weight: 600; }
.tab.active .pill { background: var(--primary-soft); }
.home-indicator { height: 5px; width: 120px; border-radius: 3px; background: #1b1d3a; margin: 6px auto 8px; flex-shrink: 0; }

/* ---------- Modales ---------- */
.overlay {
  position: absolute; inset: 0; z-index: 20;
  background: rgba(34, 38, 74, 0.35);
  display: flex; align-items: flex-end;
  backdrop-filter: blur(2px);
}
.overlay[hidden] { display: none; }
.sheet {
  width: 100%; background: #fff; border-radius: 26px 26px 0 0;
  padding: 18px 20px 26px; max-height: 85%; display: flex; flex-direction: column;
  animation: up 0.3s ease both;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.sheet-head h3 { font-size: 17px; font-weight: 600; }
.close { width: 32px; height: 32px; border-radius: 50%; background: #f1f2f9; display: grid; place-items: center; }
textarea, .input {
  width: 100%; border: 1.5px solid var(--line); border-radius: 14px;
  padding: 12px; font: inherit; font-size: 14px; resize: none; background: #fafbff; outline: none; color: var(--ink);
}
textarea:focus, .input:focus { border-color: var(--primary); }

.chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 12px; min-height: 180px; }
.bubble { max-width: 80%; padding: 10px 13px; border-radius: 16px; font-size: 13.5px; line-height: 1.4; }
.bubble.them { background: #f1f2fa; border-bottom-left-radius: 4px; align-self: flex-start; }
.bubble.me { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; align-self: flex-end; }
.chat-input { display: flex; gap: 8px; }
.chat-input .send { width: 46px; border-radius: 14px; background: var(--primary); color: #fff; display: grid; place-items: center; }

.breath { display: grid; place-items: center; padding: 20px 0 10px; }
.breath .circle {
  width: 130px; height: 130px; border-radius: 50%;
  background: radial-gradient(circle, #c9cbff, var(--primary));
  animation: breathe 8s ease-in-out infinite;
}
@keyframes breathe { 0%, 100% { transform: scale(0.7); } 50% { transform: scale(1.15); } }
.breath p { margin-top: 20px; font-size: 14px; color: var(--muted); }

.toast {
  position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
  background: #22264a; color: #fff; padding: 10px 16px; border-radius: 14px;
  font-size: 12.5px; z-index: 30; animation: fade 0.25s ease both; white-space: nowrap;
}

/* ---------- Login / registro ---------- */
.auth { display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
.auth-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; margin: 6px 0 2px; }
.auth-hero h1 { font-size: 26px; font-weight: 600; letter-spacing: -0.4px; margin-top: 4px; }
.auth-hero .subtle { max-width: 260px; line-height: 1.45; font-size: 13.5px; }
.brand.big { font-size: 15px; }
.auth-card { margin: 0; display: flex; flex-direction: column; gap: 12px; padding: 18px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.pw { position: relative; }
.pw .input { padding-right: 46px; }
.pw .eye { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; display: grid; place-items: center; color: var(--muted); border-radius: 10px; }
.auth-error { font-size: 12px; color: var(--red-dot); line-height: 1.4; }
.auth-error:empty { display: none; }
.link-btn { color: var(--primary); font-size: 12.5px; font-weight: 600; padding: 2px 4px; }
.auth-card .link-btn { align-self: center; }
.hello .name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- Encuesta emergente (pop-up centrado) ---------- */
.overlay.center { align-items: center; justify-content: center; padding: 24px; }
.overlay.center .sheet { border-radius: 24px; max-width: 340px; padding: 20px; animation: fade 0.25s ease both; }
.overlay.center .sheet-head h3 { font-size: 18px; }
.overlay.center .sheet .link-btn { display: block; }

</style>
</head>

  <div class="phone" id="app">
    <div class="statusbar">
      <span id="clock">9:41</span>
      <span class="status-icons">
        <svg width="17" height="11" viewBox="0 0 17 11" fill="currentColor"><rect x="0" y="7" width="3" height="4" rx="1"/><rect x="4.5" y="5" width="3" height="6" rx="1"/><rect x="9" y="2.5" width="3" height="8.5" rx="1"/><rect x="13.5" y="0" width="3" height="11" rx="1"/></svg>
        <svg width="16" height="11" viewBox="0 0 16 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M1 3.5a10 10 0 0 1 14 0"/><path d="M3.5 6a6.5 6.5 0 0 1 9 0"/><circle cx="8" cy="9" r="1" fill="currentColor"/></svg>
        <svg width="25" height="12" viewBox="0 0 25 12" fill="none"><rect x="0.5" y="0.5" width="21" height="11" rx="3.5" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="18" height="8" rx="2.2" fill="currentColor"/><rect x="23" y="4" width="1.6" height="4" rx=".8" fill="currentColor" opacity=".5"/></svg>
      </span>
    </div>

    <main class="screen" id="screen" aria-live="polite"></main>

    <nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>
    <div class="home-indicator"></div>

    <div class="overlay" id="overlay" hidden></div>
  </div>

  <script>
/* Refugio · app de bienestar emocional (demo estática) */
(function () {
  "use strict";

  /* ---------- Iconos (SVG de trazo) ---------- */
  const P = {
    home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/>',
    users: '<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><path d="M16 5.2a3.2 3.2 0 0 1 0 5.8"/><path d="M18 14.3c1.8.8 3 2.6 3 4.7"/>',
    heart: '<path d="M12 20s-7.5-4.6-9-9.2C2 7.600 4.200 5 7.100 5c1.900 0 3.700 1 4.900 2.800C13.200 6 15 5 16.900 5 19.800 5 22 7.600 21 10.800 19.500 15.400 12 20 12 20z"/>',
    user: '<circle cx="12" cy="8" r="3.6"/><path d="M4.500 20c0-4 3.400-6.500 7.500-6.500s7.500 2.500 7.500 6.500"/>',
    chat: '<path d="M21 12a8 8 0 0 1-11.600 7.100L4 20l1-4.600A8 8 0 1 1 21 12z"/>',
    spark: '<path d="M12 3l1.800 5.200L19 10l-5.200 1.800L12 17l-1.800-5.200L5 10l5.200-1.800z"/><path d="M19 16l.7 1.800L21.500 18.500 19.700 19.200 19 21l-.7-1.800-1.800-.7 1.800-.7z"/>',
    edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M14 6l4 4"/>',
    chev: '<path d="M9 6l6 6-6 6"/>',
    pencil: '<path d="M4 20h4L19 9l-4-4L4 16z"/>',
    shield: '<path d="M12 3l8 3v6c0 4.500-3.200 8-8 9-4.800-1-8-4.500-8-9V6z"/>',
    leaf: '<path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"/><path d="M5 19c3-5 6-8 10-10"/>',
    hearthand: '<path d="M12 20s-7-4.200-8.500-8.600C2.600 8.800 4.500 6.500 7 6.500c1.700 0 3.200.9 4.200 2.400.9-1.500 2.500-2.400 4.200-2.400 2.500 0 4.400 2.300 3.500 4.900C17.500 15.800 12 20 12 20z"/>',
    comment: '<path d="M21 12a8 8 0 0 1-11.600 7.100L4 20l1-4.600A8 8 0 1 1 21 12z"/>',
    more: '<circle cx="5" cy="12" r="1.200" fill="currentColor"/><circle cx="12" cy="12" r="1.200" fill="currentColor"/><circle cx="19" cy="12" r="1.200" fill="currentColor"/>',
    check: '<path d="M5 12.500l4.500 4.500L19 7.500"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    send: '<path d="M4 12l16-8-6 16-2.500-6.500z"/>',
    arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
    bell: '<path d="M6 17V11a6 6 0 0 1 12 0v6l1.500 2h-15z"/>',
    sprout: '<path d="M12 21v-9"/><path d="M12 12C12 8 9 6 5 6c0 4 2 6 7 6z"/><path d="M12 14c0-3 2.500-5 6-5 0 3-2 5-6 5z"/>',
    brand: '<circle cx="7" cy="17" r="2"/><circle cx="17" cy="6" r="2"/><path d="M8.500 15.500C11 13 13 11 15.500 7.500"/><path d="M5 7c2 0 4 1 5 3"/>',
    eye: '<path d="M2 12s3.600-7 10-7 10 7 10 7-3.600 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>'
  };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  async function sha(s) {
    try {
      const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
      return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, "0")).join("");
    } catch (e) { return btoa(unescape(encodeURIComponent(s))); }
  }
  const icon =(n, s = 18, sw = 1.8, extra = "") =>
    `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" ${extra}>${P[n]}</svg>`;

  /* ---------- Estado ---------- */
  const store = {
    get(k, d) { try { const v = localStorage.getItem("refugio:" + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem("refugio:" + k, JSON.stringify(v)); } catch (e) {} }
  };

  const state = {
    tab: "inicio",
    session: store.get("session", null),
    authMode: "login",
    authNick: "",
    mood: store.get("mood", 2),
    signal: store.get("signal", "red"),
    posts: store.get("posts", [
      { id: 1, animal: "Gato", emoji: "🐱", bg: "#f6e3d6", time: "Hace 15 min", text: "Hoy me costó concentrarme en clase. Salí a caminar un rato y me sentí más tranquilo.", likes: 12, liked: false },
      { id: 2, animal: "Perrito", emoji: "🐶", bg: "#efe0d2", time: "Hace 42 min", text: "A veces siento que todos tienen todo claro menos yo. ¿A alguien más le pasa? Me ayuda saber que no soy el único.", likes: 24, liked: true },
      { id: 3, animal: "Pingüino", emoji: "🐧", bg: "#e3e5f7", time: "Hace 1 h", text: "Le conté a alguien cómo me sentía. Me dio nervios, pero me alegra haber dado ese pequeño paso. 💜", likes: 18, liked: false }
    ])
  };

  const MOODS = [
    { e: "😔", l: "Muy mal" }, { e: "🙁", l: "Mal" }, { e: "😐", l: "Regular" },
    { e: "🙂", l: "Bien" }, { e: "😄", l: "Muy bien" }
  ];
  const SIGNALS = [
    { k: "green", t: "No necesito hablar con nadie", },
    { k: "yellow", t: "Quizá hable con alguien" },
    { k: "red", t: "Quiero hablar con el psicólogo" }
  ];
  const ANIMALS = [
    { n: "Zorrito", e: "🦊", bg: "#fbe3d3" }, { n: "Osito", e: "🐻", bg: "#efe0d2" },
    { n: "Conejo", e: "🐰", bg: "#f3e4ee" }, { n: "Búho", e: "🦉", bg: "#e8e3f7" },
    { n: "Panda", e: "🐼", bg: "#e6ecf4" }
  ];

  /* ---------- Pantallas ---------- */
  const views = {
    auth() {
      const reg = state.authMode === "register";
      return `
        <div class="auth">
          <div class="auth-hero">
            <div class="avatar lg" style="background:#fbe3d3">🦊</div>
            <span class="brand big">${icon("brand", 18, 1.8)} refugio</span>
            <h1>${reg ? "Crea tu espacio" : "Qué bueno verte"}</h1>
            <p class="subtle">${reg ? "No necesitas datos reales. Solo elige un apodo." : "Entra a tu espacio seguro. Aquí nadie te juzga."}</p>
          </div>

          <form class="card auth-card" data-form="auth" novalidate>
            <div class="field">
              <label for="f-apodo">${reg ? "Elige un apodo con el que te sientas cómodo" : "Tu apodo"}</label>
              <input class="input" id="f-apodo" name="apodo" type="text" placeholder="${reg ? "Por ejemplo: Luna, Gato, Sol…" : "Escribe tu apodo"}" autocomplete="username" maxlength="24" value="${esc(state.authNick)}" />
            </div>
            <div class="field">
              <label for="f-clave">Contraseña</label>
              <div class="pw">
                <input class="input" id="f-clave" name="clave" type="password" placeholder="${reg ? "Mínimo 4 caracteres" : "Tu contraseña"}" autocomplete="${reg ? "new-password" : "current-password"}" />
                <button type="button" class="eye" data-action="togglePw" aria-label="Mostrar u ocultar contraseña">${icon("eye", 18, 1.8)}</button>
              </div>
            </div>
            <p class="auth-error" id="authError" role="alert"></p>
            <button class="btn" type="submit">${reg ? "Crear cuenta" : "Iniciar sesión"}</button>
            ${reg ? "" : `<button type="button" class="link-btn" data-action="toast" data-msg="Esta demo guarda los datos solo en tu dispositivo">¿Olvidaste tu contraseña?</button>`}
          </form>

          <p class="subtle center">
            ${reg ? "¿Ya tienes cuenta?" : "¿Aún no tienes cuenta?"}
            <button type="button" class="link-btn" data-action="authMode" data-mode="${reg ? "login" : "register"}">${reg ? "Inicia sesión" : "Crear cuenta"}</button>
          </p>
          <button type="button" class="btn ghost" data-action="guest">Entrar sin cuenta</button>
          <p class="subtle center" style="font-size:11px;line-height:1.45">Tus datos se guardan solo en este dispositivo.</p>
        </div>`;
    },

    inicio() {
      return `
        <div class="header">
          <h1>Inicio</h1>
          <div class="hello"><span class="name">Hola${state.session && state.session.name ? ", " + esc(state.session.name.split(" ")[0]) : ","}</span> <div class="avatar" style="background:#f3dccb">🦊</div></div>
        </div>

        <section class="card">
          <h2>¿Cómo te sientes hoy?</h2>
          <p class="desc">Lo que sientes importa. Este es tu espacio.</p>
          <div class="moods">
            ${MOODS.map((m, i) => `
              <button class="mood ${state.mood === i ? "active" : ""}" data-action="mood" data-i="${i}" aria-label="${m.l}">
                <span class="face">${m.e}</span>${m.l}
              </button>`).join("")}
          </div>
        </section>

        <div class="banner">${icon("users", 20, 1.7)} 24 alumnos ya buscaron apoyo esta semana.</div>

        <h3 class="section-title">Un momento para ti</h3>
        <section class="pause">
          <small>PAUSA DE 2 MINUTOS</small>
          <h3>Respira. No hay prisa.</h3>
          <button class="link" data-action="pause">Hacer una pausa ${icon("arrow", 15, 2)}</button>
          <span class="art" aria-hidden="true">🦊</span>
        </section>

        <button class="row-card" data-action="go" data-tab="apoyo" style="margin-top:14px">
          <span class="ico">${icon("hearthand", 20)}</span>
          <span class="txt"><b>No tienes que poder con todo.</b><span>En Apoyo puedes dar el primer paso.</span></span>
          <span class="chev">${icon("chev", 18)}</span>
        </button>`;
    },

    perfil() {
      return `
        <div class="header">
          <h1>Mi espacio</h1>
          <span class="brand">${icon("brand", 16, 1.8)} refugio</span>
        </div>
        <p class="subtle" style="margin:-4px 0 14px 2px">A tu ritmo, sin juicios.</p>

        <section class="card">
          <h2 style="display:flex;gap:8px;align-items:center">
            <span style="color:var(--primary)">${icon("bell", 20, 1.8)}</span> Semáforo de Apoyo
          </h2>
          <p class="desc">Elige cómo te sientes respecto a hablar con alguien hoy.</p>
          <div class="semaforo">
            ${SIGNALS.map(s => `
              <button class="opt ${s.k} ${state.signal === s.k ? "active" : ""}" data-action="signal" data-k="${s.k}">
                <span>${s.t}<i class="dot ${s.k}"></i></span>
                ${state.signal === s.k ? `<span class="check">${icon("check", 14, 2.6)}</span>` : ""}
              </button>`).join("")}
          </div>
          <button class="btn" data-action="chat">${icon("chat", 18, 2)} Iniciar Chat Privado</button>
          <div class="note">${icon("heart", 13, 2)} Puedes cambiar de idea cuando quieras.</div>
        </section>

        <div class="grid2">
          <button class="mini" data-action="toast" data-msg="Pronto podrás guardar lo que te hace bien">
            <span class="ico a">${icon("spark", 18)}</span><b>Lo que me gusta</b>
            <span>Pequeñas cosas que me hacen bien.</span>
          </button>
          <button class="mini" data-action="diary">
            <span class="ico b">${icon("edit", 18)}</span><b>Diario privado</b>
            <span>Un lugar para ordenar lo que siento.</span>
          </button>
        </div>
        <p class="subtle center">No hay una forma correcta de sentirse.</p>
        <button class="btn ghost" data-action="logout" style="margin-top:16px">Cerrar sesión</button>`;
    },

    comunidad() {
      return `
        <div class="header">
          <h1>Comunidad</h1>
          <span class="brand">${icon("brand", 16, 1.8)} refugio</span>
        </div>
        <p class="subtle" style="display:flex;gap:6px;align-items:center;margin:-4px 0 14px 2px">
          <span style="color:var(--primary)">${icon("heart", 14, 2)}</span> Aquí nos escuchamos con respeto.
        </p>
        ${state.posts.map(p => `
          <article class="post">
            <div class="post-head">
              <div class="avatar sm" style="background:${p.bg}">${p.emoji}</div>
              <div class="who"><b>Anónimo · ${p.animal}</b><small>${p.time}</small></div>
              <button aria-label="Más opciones" style="color:var(--muted)" data-action="toast" data-msg="Gracias por cuidar la comunidad">${icon("more", 18)}</button>
            </div>
            <p>${p.text.replace(/</g, "&lt;")}</p>
            <div class="post-foot">
              <button class="${p.liked ? "liked" : ""}" data-action="like" data-id="${p.id}">${icon("heart", 15, 1.8)} Me gusta · ${p.likes}</button>
              <button data-action="comment" data-id="${p.id}">${icon("comment", 15, 1.8)} Comentar${p.comments ? " · " + p.comments : ""}</button>
            </div>
          </article>`).join("")}
        <div class="share"><button data-action="share">${icon("pencil", 15, 2)} Compartir cómo me siento</button></div>`;
    },

    apoyo() {
      return `
        <div class="header">
          <h1>Apoyo</h1>
          <span class="brand">${icon("brand", 16, 1.8)} refugio</span>
        </div>
        <div class="hero">
          <div class="avatar lg" style="background:#efe0d2">🐻</div>
          <div><h2>No estás a solas.</h2><p class="subtle">Pedir ayuda también es cuidarte.</p></div>
        </div>

        <section class="card">
          <div class="top-row">
            <span class="ico">${icon("chat", 18)}</span>
            <div><b>Habla con el psicólogo</b><span>Apoyo de tu centro educativo</span></div>
          </div>
          <p class="desc" style="margin-bottom:14px">Puedes empezar con un «hola». Comparte solo lo que te resulte cómodo, a tu ritmo.</p>
          <button class="btn" data-action="chat">${icon("chat", 17, 2)} Iniciar Chat Privado</button>
          <p class="subtle" style="font-size:11px;margin-top:12px;line-height:1.45">Antes de empezar, consulta cómo se cuida tu información y los horarios de atención.</p>
        </section>

        <h3 class="section-title">Otras formas de dar el primer paso</h3>
        <button class="row-card" data-action="toast" data-msg="Te ayudaremos a preparar lo que quieres contar">
          <span class="ico">${icon("users", 19)}</span>
          <span class="txt"><b>Alguien de confianza</b><span>Prepara lo que quieres contarle.</span></span>
          <span class="chev">${icon("chev", 18)}</span>
        </button>
        <button class="row-card" data-action="toast" data-msg="Recursos para los días difíciles, muy pronto">
          <span class="ico">${icon("leaf", 19)}</span>
          <span class="txt"><b>Ideas para cuidarte</b><span>Recursos para los días difíciles.</span></span>
          <span class="chev">${icon("chev", 18)}</span>
        </button>

        <div class="urgent"><b>¿Necesitas ayuda urgente?</b>
          Si estás en peligro, contacta con emergencias de tu país o busca a una persona adulta de confianza.</div>`;
    }
  };

  const TABS = [
    { k: "comunidad", l: "Comunidad", i: "users" },
    { k: "inicio", l: "Inicio", i: "home" },
    { k: "apoyo", l: "Apoyo", i: "heart" },
    { k: "perfil", l: "Perfil", i: "user" }
  ];

  /* ---------- Render ---------- */
  const $screen = document.getElementById("screen");
  const $tabbar = document.getElementById("tabbar");
  const $overlay = document.getElementById("overlay");
  const $app = document.getElementById("app");

  function render() {
    const logged = !!state.session;
    $screen.innerHTML = logged ? views[state.tab]() : views.auth();
    $tabbar.style.display = logged ? "" : "none";
    $tabbar.innerHTML = !logged ? "" : TABS.map(t => `
      <button class="tab ${state.tab === t.k ? "active" : ""}" data-action="go" data-tab="${t.k}" aria-label="${t.l}">
        <span class="pill">${icon(t.i, 20, 1.8)}</span>${t.l}
      </button>`).join("");
  }

  function go(tab) {
    state.tab = tab;
    render();
    $screen.scrollTop = 0;
  }

  /* ---------- Modales ---------- */
  function sheet(title, body, onMount) {
    $overlay.hidden = false;
    $overlay.innerHTML = `
      <div class="sheet" role="dialog" aria-modal="true" aria-label="${title}">
        <div class="sheet-head"><h3>${title}</h3>
          <button class="close" data-action="close" aria-label="Cerrar">${icon("x", 16, 2)}</button></div>
        ${body}
      </div>`;
    if (onMount) onMount($overlay);
  }
  function closeSheet() { $overlay.hidden = true; $overlay.innerHTML = ""; $overlay.classList.remove("center"); }

  function toast(msg) {
    const old = $app.querySelector(".toast");
    if (old) old.remove();
    const t = document.createElement("div");
    t.className = "toast";
    t.textContent = msg;
    $app.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  function openChat() {
    sheet("Chat privado", `
      <div class="chat" id="chat">
        <div class="bubble them">Hola 💜 Qué bueno que escribiste. Comparte solo lo que te resulte cómodo, a tu ritmo.</div>
      </div>
      <div class="chat-input">
        <input class="input" id="chatText" placeholder="Escribe un «hola»..." autocomplete="off" />
        <button class="send" id="chatSend" aria-label="Enviar">${icon("send", 18, 2)}</button>
      </div>
      <p class="subtle" style="font-size:11px;margin-top:10px">Demo: este chat no está conectado a ningún psicólogo real.</p>`,
      root => {
        const chat = root.querySelector("#chat");
        const input = root.querySelector("#chatText");
        const add = (cls, txt) => {
          const b = document.createElement("div");
          b.className = "bubble " + cls;
          b.textContent = txt;
          chat.appendChild(b);
          chat.scrollTop = chat.scrollHeight;
        };
        const send = () => {
          const v = input.value.trim();
          if (!v) return;
          add("me", v);
          input.value = "";
          setTimeout(() => add("them", "Gracias por contármelo. Aquí estoy para escucharte, sin prisa."), 900);
        };
        root.querySelector("#chatSend").addEventListener("click", send);
        input.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
        input.focus();
      });
  }

  function openPause() {
    sheet("Pausa de 2 minutos", `
      <div class="breath"><div class="circle"></div>
        <p>Inhala despacio… y suelta el aire. No hay prisa.</p></div>
      <button class="btn ghost" data-action="close">Listo, me siento mejor</button>`);
  }

  function openDiary() {
    sheet("Diario privado", `
      <textarea id="diaryText" rows="6" placeholder="Escribe lo que sientes. Solo tú lo ves."></textarea>
      <button class="btn" style="margin-top:12px" data-action="saveDiary">Guardar</button>`,
      root => {
        const ta = root.querySelector("#diaryText");
        ta.value = store.get("diary", "");
        ta.focus();
      });
  }

  function openShare() {
    sheet("Compartir cómo me siento", `
      <textarea id="postText" rows="5" maxlength="240" placeholder="Tu mensaje será anónimo y la comunidad lo leerá con respeto."></textarea>
      <button class="btn" style="margin-top:12px" data-action="publish">Publicar de forma anónima</button>`,
      root => root.querySelector("#postText").focus());
  }

  function openComment(id) {
    sheet("Escribe un comentario", `
      <textarea id="commentText" rows="4" maxlength="200" placeholder="Un mensaje amable puede hacer mucho."></textarea>
      <button class="btn" style="margin-top:12px" data-action="sendComment" data-id="${id}">Enviar comentario</button>`,
      root => root.querySelector("#commentText").focus());
  }

  /* Encuesta emergente: aparece al dejar el primer comentario */
  function openSurvey() {
    sheet("¿Cómo te sentiste?", `
      <p class="subtle" style="margin:-4px 0 4px;line-height:1.45">Cuéntanos qué tal fue comentar. Tu respuesta es anónima y nos ayuda a mejorar Refugio.</p>
      <div class="moods">
        ${MOODS.map((m, i) => `
          <button class="mood" data-action="survey" data-i="${i}" aria-label="${m.l}">
            <span class="face">${m.e}</span>${m.l}
          </button>`).join("")}
      </div>
      <button class="link-btn" style="margin-top:14px;align-self:center" data-action="close">Ahora no</button>`);
    $overlay.classList.add("center");
  }

  /* ---------- Eventos ---------- */
  document.addEventListener("click", e => {
    const el = e.target.closest("[data-action]");
    if (!el) return;
    const d = el.dataset;
    switch (d.action) {
      case "go": go(d.tab); break;
      case "mood": state.mood = +d.i; store.set("mood", state.mood); render(); break;
      case "signal": state.signal = d.k; store.set("signal", d.k); render(); break;
      case "like": {
        const p = state.posts.find(x => x.id === +d.id);
        p.liked = !p.liked; p.likes += p.liked ? 1 : -1;
        store.set("posts", state.posts); render(); break;
      }
      case "chat": openChat(); break;
      case "pause": openPause(); break;
      case "diary": openDiary(); break;
      case "share": openShare(); break;
      case "saveDiary": {
        store.set("diary", document.getElementById("diaryText").value);
        closeSheet(); toast("Guardado solo para ti"); break;
      }
      case "publish": {
        const v = document.getElementById("postText").value.trim();
        if (!v) return;
        const a = ANIMALS[Math.floor(Math.random() * ANIMALS.length)];
        state.posts.unshift({ id: Date.now(), animal: a.n, emoji: a.e, bg: a.bg, time: "Ahora", text: v, likes: 0, liked: false });
        store.set("posts", state.posts);
        closeSheet(); render(); toast("Gracias por compartir 💜"); break;
      }
      case "authMode": {
        const em = document.querySelector('form[data-form="auth"] [name="apodo"]');
        state.authNick = em ? em.value : "";
        state.authMode = d.mode; render(); break;
      }
      case "togglePw": {
        const pw = document.querySelector('form[data-form="auth"] [name="clave"]');
        if (pw) pw.type = pw.type === "password" ? "text" : "password";
        break;
      }
      case "guest": startSession({ name: "", guest: true }); break;
      case "logout":
        state.session = null; store.set("session", null);
        state.authMode = "login"; state.authNick = ""; state.tab = "inicio";
        render(); break;
      case "comment": openComment(d.id); break;
      case "sendComment": {
        const txt = document.getElementById("commentText").value.trim();
        if (!txt) return;
        const p = state.posts.find(x => x.id === +d.id);
        p.comments = (p.comments || 0) + 1;
        store.set("posts", state.posts);
        closeSheet(); render();
        if (!store.get("firstCommentDone", false)) {
          store.set("firstCommentDone", true);
          setTimeout(openSurvey, 450);
        } else toast("Gracias por comentar 💜");
        break;
      }
      case "survey":
        store.set("survey", { value: MOODS[+d.i].l, at: new Date().toISOString() });
        closeSheet(); toast("¡Gracias por contarnos!"); break;
      case "toast": toast(d.msg); break;
      case "close": closeSheet(); break;
    }
  });

  function startSession(s) {
    state.session = s; store.set("session", s);
    state.tab = "inicio"; render(); $screen.scrollTop = 0;
  }

  document.addEventListener("submit", async e => {
    const f = e.target.closest('form[data-form="auth"]');
    if (!f) return;
    e.preventDefault();
    const err = f.querySelector("#authError");
    const fail = m => { err.textContent = m; };
    const nick = f.querySelector('[name="apodo"]').value.trim();
    const key = nick.toLowerCase();
    const pass = f.querySelector('[name="clave"]').value;
    if (!nick) return fail("Escribe el apodo que quieras usar.");
    const users = store.get("users", {});
    if (state.authMode === "register") {
      if (pass.length < 4) return fail("La contraseña debe tener al menos 4 caracteres.");
      if (users[key]) return fail("Ese apodo ya existe. Prueba con otro o inicia sesión.");
      users[key] = { name: nick, hash: await sha(pass) };
      store.set("users", users);
      startSession({ name: nick });
    } else {
      const u = users[key];
      if (!u || u.hash !== await sha(pass)) return fail("Apodo o contraseña incorrectos.");
      startSession({ name: u.name });
    }
  });

  $overlay.addEventListener("click", e => { if (e.target === $overlay) closeSheet(); });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeSheet(); });

  /* Reloj de la barra de estado */
  function tick() {
    const n = new Date();
    document.getElementById("clock").textContent = n.getHours() + ":" + String(n.getMinutes()).padStart(2, "0");
  }
  tick(); setInterval(tick, 30000);

  render();
})();

</script>
</body>
</html>
